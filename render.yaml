# Render Blueprint for the Scoreline API (REST, Socket.IO and the ingest worker).
# Secrets are marked sync: false so Render asks for them; they never live in git.
services:
  - type: web
    name: scoreline-api
    runtime: node
    plan: free
    # Same region as the Neon database, so queries are fast.
    region: frankfurt
    branch: main
    autoDeploy: true
    # Render's system folders are read-only, so pnpm runs through corepack
    # directly. The build runs as "development" so build tools (TypeScript,
    # Nest CLI, Prisma CLI) are installed; the server itself runs as production.
    buildCommand: >-
      export COREPACK_ENABLE_DOWNLOAD_PROMPT=0 NODE_ENV=development &&
      corepack pnpm install --frozen-lockfile &&
      corepack pnpm --filter @scoreline/shared build &&
      corepack pnpm --filter @scoreline/api build
    # Apply any new database migrations, then start the server.
    startCommand: >-
      cd apps/api &&
      ./node_modules/.bin/prisma migrate deploy &&
      node dist/main.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: WEB_ORIGIN
        value: http://localhost:3001
      - key: DEMO_ENABLED
        value: 'true'
      - key: INGEST_ENABLED
        value: 'true'
