name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Throwaway database for the API's database tests.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: scoreline
          POSTGRES_PASSWORD: scoreline
          POSTGRES_DB: scoreline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scoreline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: API e2e and database tests
        run: pnpm --filter @scoreline/api test:e2e
        env:
          TEST_DATABASE_URL: postgresql://scoreline:scoreline@localhost:5432/scoreline_test

      - name: Build
        run: pnpm build
